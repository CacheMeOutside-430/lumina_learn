[project]
name = "lumina-vision"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "easyocr>=1.7",
  "mss>=10.0",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pillow>=12.2",
  "pytesseract>=0.3",
  "rapidocr-onnxruntime>=1.4",
  "lumina-shared",
]

[tool.setuptools.packages.find]
where = ["src"]

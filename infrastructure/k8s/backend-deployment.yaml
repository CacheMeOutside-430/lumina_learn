apiVersion: v1
kind: ConfigMap
metadata:
  name: lumina-backend-config
data:
  APP_ENV: production
  DATABASE_URL: sqlite+aiosqlite:////data/lumina.sqlite3
  CORS_ORIGINS: http://localhost:1420,http://127.0.0.1:1420,http://tauri.localhost,tauri://localhost
  VECTOR_BACKEND: chroma
  CHROMA_PATH: /data/chroma
  LOCAL_INFERENCE: "true"
  OCR_ENGINE: easyocr
  OCR_LANGUAGES: en
  MODEL_DIR: /models
  ACTIVITY_CHECKPOINT: /models/activity_classifier_best.pt
  TRAINING_METRICS_PATH: /models/metrics.jsonl
  REQUIRE_ACTIVITY_CHECKPOINT: "true"
  ALLOW_HEURISTIC_CLASSIFIER: "false"
  EMBEDDING_DIMENSION: "384"
  FRAME_PROCESSING_FPS: "2"
  MAX_FRAME_QUEUE: "8"
  MAX_FRAME_BYTES: "5000000"
  ENABLE_GPU: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumina-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: lumina-backend
  template:
    metadata:
      labels:
        app: lumina-backend
    spec:
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: backend
          image: lumina/backend:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: lumina-backend-config
          ports:
            - containerPort: 8765
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: data
              mountPath: /data
            - name: models
              mountPath: /models
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8765
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8765
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lumina-backend-data
        - name: models
          persistentVolumeClaim:
            claimName: lumina-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lumina-backend-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lumina-models
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: lumina-backend
spec:
  selector:
    app: lumina-backend
  ports:
    - name: http
      port: 8765
      targetPort: 8765

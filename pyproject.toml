[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
namespace_packages = true
explicit_package_bases = true
mypy_path = [
  "apps/backend/src",
  "packages/shared/src",
  "packages/ai-core/src",
  "packages/vision/src",
  "packages/memory/src",
  "packages/activity-classifier/src"
]
files = [
  "apps/backend/src",
  "packages/shared/src",
  "packages/ai-core/src",
  "packages/vision/src",
  "packages/memory/src",
  "packages/activity-classifier/src",
  "scripts"
]
exclude = [
  "\\.venv",
  "node_modules",
  "apps/desktop/dist",
  "data",
  "__pycache__"
]

[[tool.mypy.overrides]]
module = [
  "chromadb.*",
  "cv2.*",
  "easyocr.*",
  "faiss.*",
  "mss.*",
  "PIL.*",
  "pytesseract.*",
  "rapidocr_onnxruntime.*",
  "sentence_transformers.*",
  "transformers.*",
  "torchvision.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [
  "apps/backend/src",
  "packages/shared/src",
  "packages/ai-core/src",
  "packages/vision/src",
  "packages/memory/src",
  "packages/activity-classifier/src"
]

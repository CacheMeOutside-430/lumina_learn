services:
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/lumina.sqlite3
      CHROMA_PATH: /app/data/chroma
      MODEL_DIR: /app/models
      ACTIVITY_CHECKPOINT: /app/models/activity_classifier_best.pt
      TRAINING_METRICS_PATH: /app/models/metrics.jsonl
    ports:
      - "8765:8765"
    volumes:
      - lumina-data:/app/data
      - ./models:/app/models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/live', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  lumina-data:
